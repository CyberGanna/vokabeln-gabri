<style>
/* Layout: a single column "Heft" (German school exercise book) on squared paper; one task per screen, big tap targets. */
:root{
  --paper:#f6f8fc; --sheet:#ffffff; --grid:#e3e9f4; --ink:#1b2340; --muted:#5d6785;
  --pen:#2747d6; --pen-soft:#e5eafc; --margin:#e0505a;
  --ok:#1f8a4c; --ok-soft:#e1f4e8; --bad:#c8323d; --bad-soft:#fbe5e6;
  --der:#2459d6; --die:#d23a4a; --das:#1d8a55;
  --line:#d5dcea;
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11152a; --sheet:#1a2038; --grid:#1d2440; --ink:#e9edf9; --muted:#a2abc6;
  --pen:#8ea4ff; --pen-soft:#27305a; --margin:#ff7a83;
  --ok:#5fd394; --ok-soft:#16382a; --bad:#ff7d86; --bad-soft:#40202a;
  --der:#83a6ff; --die:#ff8592; --das:#6fdca3; --line:#2f3858; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11152a; --sheet:#1a2038; --grid:#1d2440; --ink:#e9edf9; --muted:#a2abc6;
  --pen:#8ea4ff; --pen-soft:#27305a; --margin:#ff7a83;
  --ok:#5fd394; --ok-soft:#16382a; --bad:#ff7d86; --bad-soft:#40202a;
  --der:#83a6ff; --die:#ff8592; --das:#6fdca3; --line:#2f3858; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:17px/1.5 var(--body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.9rem;font-weight:800;line-height:1.1}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.tagline{font-family:var(--display);font-weight:600;font-size:1.1rem;color:var(--pen);margin-top:4px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
nav.tabs{display:flex;gap:6px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:4px}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:700 .92rem var(--body);padding:10px 6px;border-radius:10px;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--pen-soft);color:var(--pen)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px 18px 18px 30px;position:relative;display:flex;flex-direction:column;gap:14px}
.sheet::before{content:"";position:absolute;left:16px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.55}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
button,.btn{font:700 1rem var(--body);border-radius:12px;border:2px solid var(--line);background:var(--sheet);color:var(--ink);padding:12px 16px;cursor:pointer;min-height:48px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.primary{background:var(--pen);border-color:var(--pen);color:#fff}
:root[data-theme="dark"] .primary{color:#0d1330}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .primary{color:#0d1330}}
.big{width:100%;font-size:1.15rem;padding:16px}
.ghost{border-color:transparent;background:transparent;color:var(--pen);padding:8px 10px;min-height:40px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.95rem;background:var(--sheet);color:var(--ink);min-height:42px}
.chip[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft);color:var(--pen)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:1.8rem;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--grid);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.day{aspect-ratio:1;border-radius:5px;background:var(--grid);max-width:100%}
.day.on{background:var(--ok)}
.day.mid{background:color-mix(in srgb,var(--ok) 45%,var(--grid))}
.listitem{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.listitem:first-of-type{border-top:0}
input[type=text],textarea,select{width:100%;font:1.05rem var(--body);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{min-height:170px;font-size:.98rem;line-height:1.5}
/* quiz */
.progress{display:flex;align-items:center;gap:10px}
.progress .bar{flex:1}
.prompt{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding-block:8px}
.word{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,8vw,2.6rem);line-height:1.1;overflow-wrap:anywhere}
.art-der{color:var(--der)} .art-die{color:var(--die)} .art-das{color:var(--das)}
.opts{display:grid;gap:10px}
.opt{text-align:left;font-size:1.1rem;font-weight:700;padding:14px 16px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.feedback{border-radius:12px;padding:12px 14px;font-weight:700;display:flex;flex-direction:column;gap:4px}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback .ans{color:var(--ink);font-weight:400}
.flip{min-height:180px;display:flex;flex-direction:column;justify-content:center;gap:8px;cursor:pointer;border:2px dashed var(--line);border-radius:14px;padding:18px;background:var(--paper)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.say{border-radius:999px;min-height:40px;padding:6px 12px;font-size:.9rem}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
.confetti{font-family:var(--display);font-size:3rem;line-height:1}
kbd{font:inherit;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:0 6px}
code{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:.92em}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}}
</style>

  <header class="top">

/* ---------- utility ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=(iso,n)=>{const [y,m,d]=iso.split("-").map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")};
function hash(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
const cardId=(de,it)=>hash(de.trim().toLowerCase()+"|"+it.trim().toLowerCase());
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}
function lsGet(){try{return JSON.parse(localStorage.getItem(LS_KEY)||"null")}catch(e){return null}}
function lsSet(v){try{localStorage.setItem(LS_KEY,JSON.stringify(v))}catch(e){}}

/* ---------- stato ---------- */
function blank(){return {cards:{},liste:[],attive:null,giorni:{},direzione:"it-de",modo:"misto",nuove:8,updatedAt:0}}
let S=Object.assign(blank(),lsGet()||{});
let db=null, view="home", Q=null, saving=false, dirty=false, saveTimer=null, syncNote="";

function allLists(){return [...BUILTIN,...(S.liste||[])]}
function activeIds(){const ids=allLists().map(l=>l.id);
  if(!S.attive){const real=allLists().filter(l=>!l.esempio);return (real.length?real:allLists()).map(l=>l.id)}
  return S.attive.filter(id=>ids.includes(id))}
function wordsOf(list){return list.parole.map(([de,it])=>({id:cardId(de,it),de,it,lista:list.id}))}
function activeWords(){const act=new Set(activeIds());const seen=new Set();const out=[];
  for(const l of allLists()) if(act.has(l.id)) for(const w of wordsOf(l)) if(!seen.has(w.id)){seen.add(w.id);out.push(w)}
  return out}
function allWords(){const seen=new Set(),out=[];for(const l of allLists())for(const w of wordsOf(l))if(!seen.has(w.id)){seen.add(w.id);out.push(w)}return out}
const cardOf=id=>S.cards[id]||null;

function save(){S.updatedAt=Date.now();lsSet(S);dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,1200)}
async function flush(){if(!db||!dirty||saving)return;saving=true;dirty=false;
  try{await db.doc(DOC_PATH).set(JSON.parse(JSON.stringify(S)));syncNote="Progressi salvati online"}
  catch(e){syncNote="Salvati solo su questo telefono";dirty=true}
  saving=false;if(dirty)saveTimer=setTimeout(flush,4000)}

async function connect(){
  if(!window.claude||!window.claude.use){syncNote="Progressi salvati su questo telefono. Ogni tanto fai una copia da Progressi.";render();return}
  try{db=await window.claude.use("db")}catch(e){db=null}
  if(!db){syncNote="Salvati solo su questo telefono";if(view==="home"||view==="progressi")render();return}
  try{
    const snap=await Promise.race([db.doc(DOC_PATH).get(),new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),10000))]);
    const remote=snap.exists?snap.data():null;
    if(remote&&(remote.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(blank(),JSON.parse(JSON.stringify(remote)));lsSet(S)}
    else if(!remote||(S.updatedAt||0)>(remote.updatedAt||0)){dirty=true;flush()}
    syncNote="Progressi salvati online";
  }catch(e){syncNote="Connessione lenta: progressi salvati su questo telefono"}
  if(view!=="quiz")render();
}

/* ---------- ripetizione a scatole (Leitner) ---------- */
function dueToday(){const t=today();return activeWords().filter(w=>{const c=cardOf(w.id);return c&&c.box>0&&c.due<=t})}
function newWords(){return activeWords().filter(w=>!cardOf(w.id))}
function learned(words){return words.filter(w=>{const c=cardOf(w.id);return c&&c.box>=4}).length}
function grade(w,correct){const t=today();const c=S.cards[w.id]||{box:0,due:t,ok:0,ko:0};
  if(correct){c.box=Math.min(c.box+1,INTERVALS.length-1);c.ok++}else{c.box=1;c.ko++}
  c.due=addDays(t,correct?INTERVALS[c.box]:1);c.last=t;S.cards[w.id]=c;
  const g=S.giorni[t]||{n:0,ok:0};g.n++;if(correct)g.ok++;S.giorni[t]=g;save()}
function streak(){let n=0,d=today();if(!S.giorni[d])d=addDays(d,-1);while(S.giorni[d]&&S.giorni[d].n>0){n++;d=addDays(d,-1)}return n}

/* ---------- confronto risposte ---------- */
function norm(s){return s.toLowerCase().normalize("NFC").replace(/[.,!?;:()"]/g," ").replace(/\s+/g," ").trim()}
function deUmlaut(s){return s.replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")}
function variants(s){return s.replace(/\([^)]*\)/g," ").split(/\s*\/\s*/).map(norm).filter(Boolean)}
function stripItArt(s){return s.replace(/^(il|lo|la|i|gli|le|l'|un|uno|una|un')\s*/,"")}
function check(input,target,lang){const a=norm(input);if(!a)return "bad";
  for(const v of variants(target)){
    if(a===v)return "ok";
    if(lang==="de"&&a.replace(/ß/g,"ss")===v.replace(/ß/g,"ss"))return "ok";
    if(lang==="de"&&(deUmlaut(a)===deUmlaut(v)||a.replace(/ß/g,"ss")===v.replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss")))return "quasi";
    if(lang==="it"&&stripItArt(a)===stripItArt(v))return "ok";
    if(lang==="de"){const m=v.match(/^(der|die|das)\s+(.+)$/);
      if(m&&a===m[2])return "articolo";
      if(m){const am=a.match(/^(der|die|das)\s+(.+)$/);if(am&&am[2]===m[2])return "articolo"}}
    if(lev(a,v)===1&&v.length>4)return "quasi";
  }return "bad"}
function lev(a,b){if(Math.abs(a.length-b.length)>1)return 9;const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}

function deHtml(de){const m=de.match(/^(der|die|das)\s+(.+)$/i);return m?`<span class="art-${m[1].toLowerCase()}">${esc(m[1])}</span> ${esc(m[2])}`:esc(de)}
function speak(text){try{const u=new SpeechSynthesisUtterance(text);u.lang="de-DE";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){toast("Audio non disponibile")}}

/* ---------- parsing import ---------- */
function parseList(text){const out=[];for(let line of text.split(/\r?\n/)){line=line.trim();if(!line||line.startsWith("#"))continue;
  const m=line.split(/\s*(?:\t|=|;|\s[–—-]\s|:)\s*/);if(m.length<2)continue;const de=m[0].trim(),it=m.slice(1).join(" / ").trim();if(de&&it)out.push([de,it])}return out}

function shell(inner){return `

    <button data-go="liste" ${view==="liste"?'aria-current="page"':""}>Liste</button>
  </nav>${inner}`}

function vHome(){const due=dueToday(),nw=newWords();const nNew=Math.min(nw.length,newPerNight());
  const total=Math.min(due.length+nNew,MAX_PER_NIGHT);const doneToday=(S.giorni[today()]||{}).n||0;
  const words=activeWords();const lists=allLists().filter(l=>activeIds().includes(l.id));
  const dir=S.direzione,modo=S.modo;
  return shell(`
  <section class="sheet pop">

      ${[["it-de","Italiano → Tedesco"],["de-it","Tedesco → Italiano"],["mix","Misto"]].map(([k,t])=>`<button class="chip" data-dir="${k}" aria-pressed="${dir===k}">${t}</button>`).join("")}

    <div class="chips" role="group" aria-label="Tipo di quiz">

    </div>

      ${[5,8,12,15].map(n=>`<button class="chip" data-nuove="${n}" aria-pressed="${newPerNight()===n}">${n}</button>`).join("")}
    </div>
    ${total>0?`<button class="primary big" id="start">Inizia</button>`:""}

  </section>
  <section class="sheet">
    <div class="stats">
      <div class="stat"><b>${streak()}</b><span class="small muted">sere di fila</span></div>
      <div class="stat"><b>${learned(words)}</b><span class="small muted">parole sicure</span></div>
      <div class="stat"><b>${words.length}</b><span class="small muted">parole in tutto</span></div>
    </div>
    ${boxBar(words)}
  </section>

function boxBar(words){const n=words.length||1;let nuove=0,inizio=0,quasi=0,sicure=0;
  for(const w of words){const c=cardOf(w.id);if(!c)nuove++;else if(c.box<=2)inizio++;else if(c.box<=3)quasi++;else sicure++}
  return `<div class="bar" role="img" aria-label="${sicure} sicure, ${quasi} quasi, ${inizio} da rinforzare, ${nuove} nuove">
    <span style="width:${sicure/n*100}%;background:var(--ok)"></span><span style="width:${quasi/n*100}%;background:var(--pen)"></span>
    <span style="width:${inizio/n*100}%;background:var(--margin)"></span></div>
    <div class="legend"><span><i style="background:var(--ok)"></i>Sicure ${sicure}</span><span><i style="background:var(--pen)"></i>Quasi ${quasi}</span><span><i style="background:var(--margin)"></i>Da rinforzare ${inizio}</span><span><i style="background:var(--grid)"></i>Nuove ${nuove}</span></div>`}

function vProgressi(){const days=[];for(let i=13;i>=0;i--){const d=addDays(today(),-i);days.push([d,S.giorni[d]])}
  const words=allWords();const diff=words.map(w=>[w,cardOf(w.id)]).filter(([w,c])=>c&&c.ko>0).sort((a,b)=>(b[1].ko-b[1].ok/3)-(a[1].ko-a[1].ok/3)).slice(0,10);
  const tot=Object.values(S.giorni).reduce((a,g)=>a+g.n,0),ok=Object.values(S.giorni).reduce((a,g)=>a+g.ok,0);
  return shell(`
  <section class="sheet"><p class="label">Ultime due settimane</p>
    <div class="days">${days.map(([d,g])=>`<div class="day ${g&&g.n>=10?"on":g&&g.n?"mid":""}" title="${d}: ${g?g.n:0} risposte"></div>`).join("")}</div>
    <p class="small muted">Verde pieno: almeno 10 parole studiate quella sera.</p>
    <div class="stats"><div class="stat"><b>${streak()}</b><span class="small muted">sere di fila</span></div>
      <div class="stat"><b>${tot}</b><span class="small muted">risposte date</span></div>
      <div class="stat"><b>${tot?Math.round(ok/tot*100):0}%</b><span class="small muted">giuste</span></div></div>
  </section>
  <section class="sheet"><p class="label">Per lista</p>
    ${allLists().map(l=>{const ws=wordsOf(l);return `<div class="listitem"><div class="grow"><h3>${esc(l.nome)}</h3><p class="small muted">${learned(ws)} di ${ws.length} sicure</p></div></div>${boxBar(ws)}`}).join("")}
  </section>
  <section class="sheet"><p class="label">Parole difficili</p>
    ${diff.length?diff.map(([w,c])=>`<div class="listitem"><div class="grow"><b>${deHtml(w.de)}</b><p class="small muted">${esc(w.it)}</p></div><span class="small muted">${c.ko} errori</span></div>`).join(""):`<p class="muted">Ancora nessun errore registrato.</p>`}
  </section>
  <section class="sheet"><p class="label">Copia dei progressi</p>
    <p class="small muted">Per non perdere i progressi se cambi telefono o cancelli i dati del browser. Copia il codice e salvalo in una nota o mandalo per messaggio.</p>
    <button id="backup">Copia il codice dei progressi</button>
    <textarea id="restoretext" placeholder="Incolla qui un codice per ripristinare i progressi" style="min-height:90px"></textarea>
    <button id="restore">Ripristina dal codice</button>
  </section>
  <p class="small muted">${esc(syncNote)}</p>`)}

function vListe(){const act=new Set(activeIds());
  return shell(`
  <section class="sheet"><p class="label">Cosa studiare</p>
    ${allLists().map(l=>`<div class="listitem"><input type="checkbox" id="l-${l.id}" data-toggle="${l.id}" ${act.has(l.id)?"checked":""} style="width:22px;height:22px">
      <label class="grow" for="l-${l.id}"><b>${esc(l.nome)}</b><br><span class="small muted">${l.parole.length} parole</span></label>
      ${l.esempio||BUILTIN.includes(l)?"":`<button class="ghost" data-del="${l.id}">Elimina</button>`}</div>`).join("")}
  </section>
  <section class="sheet"><p class="label">Aggiungi una lista</p>
    <input type="text" id="newname" placeholder="Nome della lista, es. Kapitel 3 · Familie">
    <textarea id="newtext" placeholder="Una parola per riga, tedesco = italiano&#10;der Hund = il cane&#10;die Katze = il gatto&#10;laufen = correre"></textarea>
    <p class="small muted">Separatori accettati: <code>=</code> <code>;</code> <code>:</code> tabulazione o trattino. Più traduzioni con <code>/</code>. Metti sempre l'articolo (der, die, das).</p>
    <button class="primary" id="addlist">Aggiungi lista</button>
  </section>`)}

/* ---------- quiz ---------- */
function startQuiz(free){let items;
  if(free){const seen=activeWords().filter(w=>cardOf(w.id));items=shuffle(seen.length>=4?seen:activeWords()).slice(0,10)}
  else{const due=shuffle(dueToday()).sort((a,b)=>cardOf(a.id).box-cardOf(b.id).box);const nw=newWords().slice(0,newPerNight());items=[...due,...nw].slice(0,MAX_PER_NIGHT);items=shuffle(items)}
  if(!items.length)return;
  Q={queue:items.map(w=>({w,tries:0})),done:0,total:items.length,ok:0,errs:[],cur:null,state:"ask",free};nextQ()}
function pickMode(entry){const m=S.modo;const c=cardOf(entry.w.id);
  if(m!=="misto")return m;
  if(!c||c.box<=1)return entry.tries?"scelta":"carte";
  return c.box<=2?"scelta":"scrivi"}
function pickDir(){return S.direzione==="mix"?(Math.random()<.5?"it-de":"de-it"):S.direzione}
function nextQ(){if(!Q.queue.length){view="fine";render();return}
  const e=Q.queue.shift();Q.cur={...e,mode:pickMode(e),dir:pickDir(),answer:"",result:null,flipped:false};
  if(Q.cur.mode==="scelta"){const pool=allWords().filter(x=>x.id!==e.w.id);const key=Q.cur.dir==="it-de"?"de":"it";
    const pkey=key==="de"?"it":"de";const pn=variants(e.w[pkey]).join("|");
    const seen=new Set([e.w[key]]);for(const x of pool)if(variants(x[pkey]).join("|")===pn)seen.add(x[key]);const opts=[e.w];for(const x of shuffle(pool)){if(opts.length>=4)break;if(!seen.has(x[key])){seen.add(x[key]);opts.push(x)}}
    Q.cur.opts=shuffle(opts)}
  view="quiz";render()}
function answer(correct,extra){const c=Q.cur;c.result=correct?"ok":"bad";c.extra=extra||"";
  if(c.tries===0){grade(c.w,correct);if(correct)Q.ok++;else Q.errs.push(c.w)}
  if(!correct)Q.queue.splice(Math.min(Q.queue.length,3),0,{w:c.w,tries:c.tries+1});else Q.done++;
  render()}

function vQuiz(){const c=Q.cur,w=c.w;const askDe=c.dir==="de-it";const prompt=askDe?w.de:w.it;const target=askDe?w.it:w.de;
  const pct=Q.done/Q.total*100;
  let body="";
  if(c.mode==="carte"){
    body=`<div class="flip" id="flip" role="button" tabindex="0" aria-label="Gira la carta">
      ${c.flipped?`<p class="label">Risposta</p><p class="word">${askDe?esc(w.it):deHtml(w.de)}</p>`:`<p class="muted">Pensa alla risposta, poi tocca qui per girare la carta.</p>`}</div>
      ${c.flipped&&!c.result?`<div class="two"><button id="no" style="border-color:var(--bad);color:var(--bad)">Non lo sapevo</button><button id="si" style="border-color:var(--ok);color:var(--ok)">Lo sapevo</button></div>`:""}`;
  }else if(c.mode==="scelta"){
    const key=askDe?"it":"de";
    body=`<div class="opts">${c.opts.map((o,i)=>{let cls="";if(c.result){if(o.id===w.id)cls="ok";else if(c.picked===i)cls="bad"}
      return `<button class="opt ${cls}" data-opt="${i}" ${c.result?"disabled":""}>${key==="de"?deHtml(o.de):esc(o.it)}</button>`}).join("")}</div>`;
  }else{
    body=`<form id="typeform" class="row" autocomplete="off"><input type="text" id="typed" class="grow" placeholder="${askDe?"Scrivi in italiano":"Scrivi in tedesco, con l'articolo"}" value="${esc(c.answer)}" ${c.result?"disabled":""} autocapitalize="off" spellcheck="false" lang="${askDe?"it":"de"}">
      ${c.result?"":`<button class="primary" type="submit">Controlla</button>`}</form>
      ${!askDe&&!c.result?`<div class="chips">${["ä","ö","ü","ß"].map(k=>`<button class="chip" data-key="${k}" type="button">${k}</button>`).join("")}<button class="chip" id="dunno" type="button">Non lo so</button></div>`:""}`;
  }
  let fb="";
  if(c.result){const msgs={ok:["Giusto!","Richtig!","Super!","Perfetto!"],bad:["Non ancora","Quasi, riprova più tardi"]};
    const m=c.result==="ok"?msgs.ok[Math.random()*msgs.ok.length|0]:"Non ancora: la ritrovi tra poco.";
    fb=`<div class="feedback ${c.result} pop"><span>${c.extra||m}</span><span class="ans">${deHtml(w.de)} = ${esc(w.it)}</span></div>
      <button class="primary big" id="next">${Q.queue.length?"Avanti":"Fine"}</button>`}
  return `
  <div class="progress"><button class="ghost" id="quit" aria-label="Esci dal quiz">✕ Esci</button><div class="bar"><span style="width:${pct}%;background:var(--ok)"></span></div><span class="small muted" style="font-variant-numeric:tabular-nums">${Q.done}/${Q.total}</span></div>
  <section class="sheet pop">
    <div class="prompt"><p class="label">${askDe?"Cosa vuol dire?":"Come si dice in tedesco?"}</p>
      <p class="word">${askDe?deHtml(prompt):esc(prompt)}</p>
      ${askDe||c.result||c.flipped?`<button class="say" id="say" type="button">Ascolta</button>`:""}</div>
    ${body}${fb}
  </section>`}

function vFine(){const t=Q.total,ok=Q.ok;const pct=t?Math.round(ok/t*100):0;
  const errs=[...new Map(Q.errs.map(w=>[w.id,w])).values()];
  return `
  <section class="sheet pop" style="text-align:left">
    <p class="confetti">${pct>=80?"Toll!":pct>=50?"Gut gemacht!":"Weiter so!"}</p>
    <h2>${ok} su ${t} giuste al primo colpo</h2>
    <p class="muted">${Q.free?"Ripasso libero completato.":"Studio di stasera completato. Ci vediamo domani sera!"} Sei a ${streak()} ${streak()===1?"sera":"sere"} di fila.</p>
    ${errs.length?`<p class="label">Da ripassare</p>${errs.map(w=>`<div class="listitem"><div class="grow"><b>${deHtml(w.de)}</b><p class="small muted">${esc(w.it)}</p></div></div>`).join("")}`:""}
    <button class="primary big" id="home">Torna alla pagina iniziale</button>
  </section>`}

function render(){const app=$("#app");
  app.innerHTML=view==="quiz"?vQuiz():view==="fine"?vFine():view==="progressi"?vProgressi():view==="liste"?vListe():vHome();
  if(view==="quiz"){const inp=$("#typed");if(inp&&!inp.disabled)inp.focus();else{const n=$("#next");if(n)n.focus()}}
  window.scrollTo(0,0)}

/* ---------- eventi ---------- */
document.addEventListener("click",e=>{const t=e.target.closest("button,[data-toggle],#flip");if(!t)return;
  if(t.dataset.go){view=t.dataset.go;render();return}
  if(t.dataset.dir){S.direzione=t.dataset.dir;save();render();return}
  if(t.dataset.modo){S.modo=t.dataset.modo;save();render();return}
  if(t.dataset.nuove){S.nuove=+t.dataset.nuove;save();render();return}
  if(t.id==="start"){startQuiz(false);return}
  if(t.id==="backup"){const code="VOK1:"+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    const fallback=()=>{const ta=$("#restoretext");ta.value=code;ta.select();toast("Codice selezionato: copialo")};
    try{navigator.clipboard.writeText(code).then(()=>toast("Codice copiato"),fallback)}catch(e){fallback()}return}
  if(t.id==="restore"){const v=$("#restoretext").value.trim();
    try{if(!v.startsWith("VOK1:"))throw 0;const o=JSON.parse(decodeURIComponent(escape(atob(v.slice(5)))));if(!o||typeof o.cards!=="object")throw 0;
      S=Object.assign(blank(),o);save();render();toast("Progressi ripristinati")}catch(e){toast("Codice non valido: incollalo intero, a partire da VOK1:")}return}
  if(t.id==="free"){startQuiz(true);return}
  if(t.id==="home"){view="home";render();return}
  if(t.id==="quit"){view="home";Q=null;render();return}
  if(t.id==="next"){nextQ();return}
  if(t.id==="say"){speak(Q.cur.w.de);return}
  if(t.id==="flip"){if(!Q.cur.flipped){Q.cur.flipped=true;if(Q.cur.dir==="it-de")speak(Q.cur.w.de);render()}return}
  if(t.id==="si"){answer(true);return}
  if(t.id==="no"){answer(false);return}
  if(t.id==="dunno"){Q.cur.answer="";answer(false);return}
  if(t.dataset.key){const i=$("#typed");const p=i.selectionStart??i.value.length;i.value=i.value.slice(0,p)+t.dataset.key+i.value.slice(i.selectionEnd??p);Q.cur.answer=i.value;i.focus();i.setSelectionRange(p+1,p+1);return}
  if(t.dataset.opt!==undefined){const i=+t.dataset.opt;Q.cur.picked=i;answer(Q.cur.opts[i].id===Q.cur.w.id);return}
  if(t.dataset.del){S.liste=S.liste.filter(l=>l.id!==t.dataset.del);if(S.attive)S.attive=S.attive.filter(x=>x!==t.dataset.del);save();render();toast("Lista eliminata");return}
  if(t.id==="addlist"){const name=$("#newname").value.trim()||"Lista "+((S.liste||[]).length+1);const parole=parseList($("#newtext").value);
    if(!parole.length){toast("Nessuna parola trovata: scrivi tedesco = italiano, una per riga");return}
    const id="u-"+Date.now().toString(36);S.liste=[...(S.liste||[]),{id,nome:name,parole}];S.attive=[...activeIds().filter(x=>!allLists().find(l=>l.id===x&&l.esempio)),id];save();render();toast(`Aggiunte ${parole.length} parole`);return}
});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset&&t.dataset.toggle){let a=new Set(activeIds());t.checked?a.add(t.dataset.toggle):a.delete(t.dataset.toggle);S.attive=[...a];save()}});
document.addEventListener("input",e=>{if(e.target.id==="typed"&&Q&&Q.cur)Q.cur.answer=e.target.value});
document.addEventListener("submit",e=>{if(e.target.id!=="typeform")return;e.preventDefault();const c=Q.cur;if(c.result)return;
  const askDe=c.dir==="de-it";const pk=askDe?"de":"it",tk=askDe?"it":"de";const pn=variants(c.w[pk]).join("|");
  const targets=[c.w[tk],...allWords().filter(x=>x.id!==c.w.id&&variants(x[pk]).join("|")===pn).map(x=>x[tk])];
  const rank={ok:3,quasi:2,articolo:1,bad:0};let r="bad";for(const t of targets){const x=check(c.answer,t,askDe?"it":"de");if(rank[x]>rank[r])r=x}
  if(r==="ok")answer(true);
  else if(r==="quasi")answer(true,"Giusto! Attenzione solo a come si scrive:");
  else if(r==="articolo")answer(false,"Parola giusta, ma l'articolo è sbagliato o manca:");
  else answer(false)});
document.addEventListener("keydown",e=>{if(view!=="quiz"||!Q||!Q.cur)return;
  if(e.key==="Enter"&&Q.cur.result&&e.target.id!=="typed"){e.preventDefault();nextQ()}
  if(Q.cur.mode==="carte"&&!Q.cur.result&&(e.key===" "||e.key==="Enter")&&!Q.cur.flipped){e.preventDefault();Q.cur.flipped=true;render()}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flush()});

render();connect();
</script>

</body>
</html>
