<style>
/* Layout: a single column "Heft" (German school exercise book) on squared paper; one task per screen, big tap targets. */
:root{
  --paper:#f6f8fc; --sheet:#ffffff; --grid:#e3e9f4; --ink:#1b2340; --muted:#5d6785;
  --pen:#2747d6; --pen-soft:#e5eafc; --margin:#e0505a;
  --ok:#1f8a4c; --ok-soft:#e1f4e8; --bad:#c8323d; --bad-soft:#fbe5e6;
  --der:#2459d6; --die:#d23a4a; --das:#1d8a55;
  --line:#d5dcea;
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11152a; --sheet:#1a2038; --grid:#1d2440; --ink:#e9edf9; --muted:#a2abc6;
  --pen:#8ea4ff; --pen-soft:#27305a; --margin:#ff7a83;
  --ok:#5fd394; --ok-soft:#16382a; --bad:#ff7d86; --bad-soft:#40202a;
  --der:#83a6ff; --die:#ff8592; --das:#6fdca3; --line:#2f3858; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11152a; --sheet:#1a2038; --grid:#1d2440; --ink:#e9edf9; --muted:#a2abc6;
  --pen:#8ea4ff; --pen-soft:#27305a; --margin:#ff7a83;
  --ok:#5fd394; --ok-soft:#16382a; --bad:#ff7d86; --bad-soft:#40202a;
  --der:#83a6ff; --die:#ff8592; --das:#6fdca3; --line:#2f3858; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:17px/1.5 var(--body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.9rem;font-weight:800;line-height:1.1}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.tagline{font-family:var(--display);font-weight:600;font-size:1.1rem;color:var(--pen);margin-top:4px}
.db-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.db-tile{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.db-tile b{font-family:var(--display);font-size:1.8rem;line-height:1.05;font-variant-numeric:tabular-nums}
.db-chart{position:relative}.db-chart svg{display:block;width:100%;height:auto}
.db-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:.8rem;padding:5px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-115%)}
.db-scroll{overflow-x:auto}
.db-table{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
.db-table th,.db-table td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.db-table th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.db-table .r{text-align:center}
.db-pill{display:inline-block;padding:1px 6px;border-radius:99px;font-weight:700;font-size:.78rem}
.db-pill.ok{background:var(--ok-soft);color:var(--ok)}.db-pill.mid{background:var(--pen-soft);color:var(--pen)}.db-pill.bad{background:var(--bad-soft);color:var(--bad)}
.tipoform{display:flex;flex-direction:column;gap:10px}.tipoform input{width:100%;box-sizing:border-box}
.chip.ok{border-color:var(--ok)!important;background:var(--ok-soft);color:var(--ok)}.chip.bad{border-color:var(--bad)!important;background:var(--bad-soft);color:var(--bad)}
.filebtn{display:flex;align-items:center;justify-content:center;cursor:pointer;text-align:center}
.fotoprev{display:block;width:100%;max-height:50vh;object-fit:contain;border-radius:12px;border:1px solid var(--line)}
.rounds{margin:0;padding-left:1.3em;display:grid;gap:2px}
.phases{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.phases span{height:6px;border-radius:99px;background:var(--grid)}.phases .done{background:var(--ok)}.phases .now{background:var(--pen)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
nav.tabs{display:flex;gap:6px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:4px}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:700 .92rem var(--body);padding:10px 6px;border-radius:10px;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--pen-soft);color:var(--pen)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px 18px 18px 30px;position:relative;display:flex;flex-direction:column;gap:14px}
.sheet::before{content:"";position:absolute;left:16px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.55}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
button,.btn{font:700 1rem var(--body);border-radius:12px;border:2px solid var(--line);background:var(--sheet);color:var(--ink);padding:12px 16px;cursor:pointer;min-height:48px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.primary{background:var(--pen);border-color:var(--pen);color:#fff}
:root[data-theme="dark"] .primary{color:#0d1330}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .primary{color:#0d1330}}
.big{width:100%;font-size:1.15rem;padding:16px}
.ghost{border-color:transparent;background:transparent;color:var(--pen);padding:8px 10px;min-height:40px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.95rem;background:var(--sheet);color:var(--ink);min-height:42px}
.chip[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft);color:var(--pen)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:1.8rem;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--grid);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.day{aspect-ratio:1;border-radius:5px;background:var(--grid);max-width:100%}
.day.on{background:var(--ok)}
.day.mid{background:color-mix(in srgb,var(--ok) 45%,var(--grid))}
.listitem{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.listitem:first-of-type{border-top:0}
input[type=text],textarea,select{width:100%;font:1.05rem var(--body);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{min-height:170px;font-size:.98rem;line-height:1.5}
/* quiz */
.progress{display:flex;align-items:center;gap:10px}
.progress .bar{flex:1}
.prompt{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding-block:8px}
.word{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,8vw,2.6rem);line-height:1.1;overflow-wrap:anywhere}
.art-der{color:var(--der)} .art-die{color:var(--die)} .art-das{color:var(--das)}
.opts{display:grid;gap:10px}
.opt{text-align:left;font-size:1.1rem;font-weight:700;padding:14px 16px}
.opt.sel{border-color:var(--pen);background:var(--pen-soft);color:var(--pen)}
button:disabled{cursor:default}
button:disabled:not(.opt){opacity:.45}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.feedback{border-radius:12px;padding:12px 14px;font-weight:700;display:flex;flex-direction:column;gap:4px}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback .ans{color:var(--ink);font-weight:400}
.flip{min-height:180px;display:flex;flex-direction:column;justify-content:center;gap:8px;cursor:pointer;border:2px dashed var(--line);border-radius:14px;padding:18px;background:var(--paper)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.say{border-radius:999px;min-height:40px;padding:6px 12px;font-size:.9rem}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
.confetti{font-family:var(--display);font-size:3rem;line-height:1}
kbd{font:inherit;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:0 6px}
code{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:.92em}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}}
</style>

function currentIdx(){const L=allLists();const i=L.findIndex(l=>!chapterDone(l));return i<0?L.length-1:i}
function currentList(){return allLists()[currentIdx()]}
function activeIds(){return allLists().slice(0,currentIdx()+1).map(l=>l.id)}
function wordsOf(list){return list.parole.map(([de,it])=>({id:cardId(de,it),de,it,lista:list.id}))}
function activeWords(){const act=new Set(activeIds());const seen=new Set();const out=[];
  for(const l of allLists()) if(act.has(l.id)) for(const w of wordsOf(l)) if(!seen.has(w.id)){seen.add(w.id);out.push(w)}
  return out}
/* Parole aggiunte da Gabri: S.mie=[[de,it,tipo]]. Entrano per prime nello studio della sera. */
const MIE={id:"mie",nome:"Le mie parole"};
/* EXTRA: parole aggiunte da Claude dalle foto delle pagine del libro, formato [de,it,tipo]. Hanno la precedenza come le mie parole. */
const EXTRA=[];
const nascosta=de=>(S.nascoste||[]).includes(de);
const mieList=()=>[...EXTRA,...(S.dalbot||[]).filter(p=>!nascosta(p[0])),...(S.mie||[])];
/* Parole dal bot Telegram: il bot le salva nel Foglio Google (foglio "Parole") con il codice famiglia; l'app le scarica qui. */
async function loadBotWords(){if(!REPORT_URL||!S.famiglia)return;
  try{const r=await fetch(REPORT_URL+"?parole=1&famiglia="+encodeURIComponent(S.famiglia)+"&t="+Date.now());const j=await r.json();
    const known=new Set([...allLists().flatMap(l=>l.parole.map(p=>norm(p[0].replace(/^(der|die|das)\s+/i,"").replace(/\([^)]*\)/g,"")))),...[...EXTRA,...(S.mie||[])].map(p=>norm(p[0].replace(/^(der|die|das)\s+/i,"")))]);
    const out=[];for(const p of j.parole||[]){const k=norm(String(p.de).replace(/^(der|die|das)\s+/i,"").replace(/\([^)]*\)/g,""));if(!k||known.has(k))continue;known.add(k);
      const tp=/^(der|die|das)\s/i.test(p.de)?"s":(["s","a","v","av","x"].includes(p.tipo)?p.tipo:"x");out.push([String(p.de),String(p.it),tp])}
    const oldK=new Set((S.dalbot||[]).map(p=>p[0]));const nuove=out.filter(p=>!oldK.has(p[0]));S.dalbot=out;save();
    if(nuove.length){toast(`${nuove.length} parole nuove dal bot`);if(view==="home"||view==="liste")render()}return nuove}catch(e){return null}}
/* Dopo l'invio di una foto: controlla ogni 10 secondi per 4 minuti se il bot ha aggiunto parole, e lo mostra nel tab Foto. */
let attesa=null; // {t0, nuove:[], fatto}
async function aspettaParole(){if(attesa&&attesa.timer)clearTimeout(attesa.timer);attesa={t0:Date.now(),nuove:[],fatto:false};if(view==="foto")render();
  const giro=async()=>{const n=await loadBotWords();if(n&&n.length){attesa.nuove.push(...n);attesa.fatto=true;if(view==="foto")render();return}
    if(Date.now()-attesa.t0>240000){attesa.fatto=true;if(view==="foto")render();return}
    attesa.timer=setTimeout(giro,10000)};
  attesa.giro=giro;attesa.timer=setTimeout(giro,8000)}
const mieWords=()=>mieList().map(([de,it])=>({id:cardId(de,it),de,it,lista:"mie"}));
function allWords(){const seen=new Set(),out=[];for(const l of [...allLists(),{...MIE,parole:mieList()}])for(const w of wordsOf(l))if(!seen.has(w.id)){seen.add(w.id);out.push(w)}return out}
const cardOf=id=>S.cards[id]||null;

function save(){S.updatedAt=Date.now();lsSet(S);dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,1200)}
async function flush(){if(!db||!dirty||saving)return;saving=true;dirty=false;
  try{await db.doc(DOC_PATH).set(JSON.parse(JSON.stringify(S)));syncNote="Progressi salvati online"}
  catch(e){syncNote="Salvati solo su questo telefono";dirty=true}
  saving=false;if(dirty)saveTimer=setTimeout(flush,4000)}

async function connect(){
  if(!window.claude||!window.claude.use){syncNote="Progressi salvati su questo telefono. Ogni tanto fai una copia da Progressi.";render();return}
  try{db=await window.claude.use("db")}catch(e){db=null}
  if(!db){syncNote="Salvati solo su questo telefono";if(view==="home"||view==="progressi")render();return}
  try{
    const snap=await Promise.race([db.doc(DOC_PATH).get(),new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),10000))]);
    const remote=snap.exists?snap.data():null;
    if(remote&&(remote.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(blank(),JSON.parse(JSON.stringify(remote)));lsSet(S)}
    else if(!remote||(S.updatedAt||0)>(remote.updatedAt||0)){dirty=true;flush()}
    syncNote="Progressi salvati online";
  }catch(e){syncNote="Connessione lenta: progressi salvati su questo telefono"}
  if(view!=="quiz")render();
}

/* ---------- ripetizione a scatole (Leitner) ---------- */
function dueToday(){const t=today();return activeWords().filter(w=>{const c=cardOf(w.id);return c&&c.box>0&&c.due<=t})}
const tentOf=id=>(S.tent||{})[id]||null;
const isWrong=id=>!!(S.wrong||{})[id];
function newWords(){const t=today();
  const todo=wordsOf(currentList()).filter(w=>!isDone(w.id)&&!(tentOf(w.id)&&tentOf(w.id).d===t));
  const mie=mieWords().filter(w=>!isDone(w.id)&&!(tentOf(w.id)&&tentOf(w.id).d===t));const ids=new Set(mie.map(w=>w.id));
  const all=[...mie,...todo.filter(w=>!ids.has(w.id))];
  return [...all.filter(w=>isWrong(w.id)),...all.filter(w=>!isWrong(w.id))]}
function wrongPending(){return newWords().filter(w=>isWrong(w.id)).length}
function attemptedToday(){const t=today();return Object.values(S.tent||{}).filter(x=>x.d===t).length}
function newLeftToday(){return Math.max(0,Math.min(newPerNight()-attemptedToday(),newWords().length))}
function oldPool(){const i=currentIdx();return i>0?wordsOf(allLists()[i-1]):[]}
/* Le 3 del capitolo precedente: prima quelle sbagliate più volte, poi a caso. */
function pickHard(pool,n){const ko=w=>(cardOf(w.id)||{}).ko||0;
  return shuffle(pool).sort((a,b)=>ko(b)-ko(a)).slice(0,n)}
const sessionDone=()=>!!(S.fatto||{})[today()];
function learned(words){return words.filter(w=>{const c=cardOf(w.id);return c&&c.box>=4}).length}
function grade(w,correct){const t=today();const c=S.cards[w.id]||{box:0,due:t,ok:0,ko:0,intro:t};
  if(correct){c.box=Math.min(c.box+1,INTERVALS.length-1);c.ok++}else{c.box=1;c.ko++}
  c.due=addDays(t,correct?INTERVALS[c.box]:1);c.last=t;S.cards[w.id]=c;
  const g=S.giorni[t]||{n:0,ok:0};g.n++;if(correct)g.ok++;S.giorni[t]=g;save()}
function streak(){let n=0,d=today();if(!S.giorni[d])d=addDays(d,-1);while(S.giorni[d]&&S.giorni[d].n>0){n++;d=addDays(d,-1)}return n}

/* ---------- confronto risposte ---------- */
function norm(s){return s.toLowerCase().normalize("NFC").replace(/[.,!?;:()"]/g," ").replace(/\s+/g," ").trim()}
function deUmlaut(s){return s.replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")}
function variants(s){return s.replace(/\([^)]*\)/g," ").split(/\s*\/\s*/).map(norm).filter(Boolean)}
function stripItArt(s){return s.replace(/^(il|lo|la|i|gli|le|l'|un|uno|una|un')\s*/,"")}
function check(input,target,lang){const a=norm(input);if(!a)return "bad";
  for(const v of variants(target)){
    if(a===v)return "ok";
    if(lang==="de"&&a.replace(/ß/g,"ss")===v.replace(/ß/g,"ss"))return "ok";
    if(lang==="de"&&(deUmlaut(a)===deUmlaut(v)||a.replace(/ß/g,"ss")===v.replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss")))return "quasi";
    if(lang==="it"&&stripItArt(a)===stripItArt(v))return "ok";
    if(lang==="de"){const m=v.match(/^(der|die|das)\s+(.+)$/);
      if(m&&a===m[2])return "articolo";
      if(m){const am=a.match(/^(der|die|das)\s+(.+)$/);if(am&&am[2]===m[2])return "articolo"}}
    if(lev(a,v)===1&&v.length>4)return "quasi";
  }return "bad"}
function lev(a,b){if(Math.abs(a.length-b.length)>1)return 9;const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}

function deHtml(de){const m=de.match(/^(der|die|das)\s+(.+)$/i);return m?`<span class="art-${m[1].toLowerCase()}">${esc(m[1])}</span> ${esc(m[2])}`:esc(de)}
/* Voce tedesca: senza scegliere una voce, iPhone e Chrome usano spesso quella inglese. Preferisce de-DE, poi de-CH/de-AT. */
let deVoice=null;
function pickDeVoice(){try{const vs=speechSynthesis.getVoices()||[];const de=vs.filter(v=>/^de([-_]|$)/i.test(v.lang));
  const score=v=>(/^de[-_]DE$/i.test(v.lang)?10:0)+(/anna|helena|markus|petra|yannick|google deutsch/i.test(v.name)?5:0)+(/premium|enhanced|natural|neural/i.test(v.name)?3:0)+(v.localService?1:0);
  deVoice=de.sort((a,b)=>score(b)-score(a))[0]||null}catch(e){}}
try{pickDeVoice();speechSynthesis.addEventListener&&speechSynthesis.addEventListener("voiceschanged",pickDeVoice)}catch(e){}
function speak(text){try{if(!deVoice)pickDeVoice();text=String(text).replace(/\([^)]*\)/g," ").split(" / ")[0].trim();const u=new SpeechSynthesisUtterance(text);u.lang="de-DE";if(deVoice)u.voice=deVoice;u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){toast("Audio non disponibile")}}

/* ---------- parsing import ---------- */
function parseList(text){const out=[];for(let line of text.split(/\r?\n/)){line=line.trim();if(!line||line.startsWith("#"))continue;
  const m=line.split(/\s*(?:\t|=|;|\s[–—-]\s|:)\s*/);if(m.length<2)continue;const de=m[0].trim(),it=m.slice(1).join(" / ").trim();if(de&&it)out.push([de,it])}return out}

function boxBar(words){const n=words.length||1;let nuove=0,inizio=0,quasi=0,sicure=0;
  for(const w of words){const c=cardOf(w.id);if(!c)nuove++;else if(c.box<=2)inizio++;else if(c.box<=3)quasi++;else sicure++}
  return `<div class="bar" role="img" aria-label="${sicure} sicure, ${quasi} quasi, ${inizio} da rinforzare, ${nuove} nuove">
    <span style="width:${sicure/n*100}%;background:var(--ok)"></span><span style="width:${quasi/n*100}%;background:var(--pen)"></span>
    <span style="width:${inizio/n*100}%;background:var(--margin)"></span></div>
    <div class="legend"><span><i style="background:var(--ok)"></i>Sicure ${sicure}</span><span><i style="background:var(--pen)"></i>Quasi ${quasi}</span><span><i style="background:var(--margin)"></i>Da rinforzare ${inizio}</span><span><i style="background:var(--grid)"></i>Nuove ${nuove}</span></div>`}

      ${bot.slice().reverse().map(([de,it,tp])=>`<div class="listitem"><div class="grow" style="min-width:0">${deHtml(de)} <span class="muted">= ${esc(it)}</span><br><span class="small muted">${TIPO_NOMI[tp]||""}${isDone(cardId(de,it))?" · imparata":""}</span></div><button class="ghost" data-botdel="${esc(de)}">Togli</button></div>`).join("")}

      <div class="grow"><b>${esc(l.nome)}</b><br><span class="small muted">${stato==="Completato"?`${ws.length} parole imparate`:stato==="In corso"?`${st} di ${ws.length} parole imparate`:`${ws.length} parole`}</span></div>

/* ---------- quiz ---------- */
function startQuiz(kind){let items;
  if(kind==="flashfoto"){const m=mieWords();items=[...shuffle(m.filter(w=>!isDone(w.id))),...shuffle(m.filter(w=>isDone(w.id)))].slice(0,20).map(w=>({w,mode:"carte",dir:"it-de"}))}
  else if(kind==="flashimp"){items=shuffle(imparateTutte()).slice(0,20).map(w=>({w,mode:"carte",dir:"it-de"}))}
  else if(kind==="flash"){const seen=new Set(),pool=[];for(const w of [...mieWords(),...wordsOf(currentList())])if(!seen.has(w.id)){seen.add(w.id);pool.push(w)}
    const nd=pool.filter(w=>!isDone(w.id)),dn=pool.filter(w=>isDone(w.id));items=[...shuffle(nd),...shuffle(dn)].slice(0,20).map(w=>({w,mode:"carte",dir:"it-de"}))}
  else if(kind==="libero"){const seen=activeWords().filter(w=>cardOf(w.id));items=shuffle(seen).slice(0,10).map(w=>({w}))}
  else if(kind==="ripasso"){items=shuffle(dueToday()).slice(0,20).map(w=>({w}))}
  else{const lim=newLeftToday(),all=newWords();const p1=all.filter(w=>!passedR1(w.id)),p2=all.filter(w=>passedR1(w.id));
    const r2=p2.slice(0,lim-Math.min(R1_PER_NIGHT,p1.length));const r1=p1.slice(0,lim-r2.length);
    const nw=[...r2,...r1]; // 5 al round 1 (TED→ITA), il resto al round 2 (ITA→TED); se il round 2 non ne ha abbastanza, si riempie con il round 1
    const old=sessionDone()?[]:pickHard(oldPool(),OLD_PER_NIGHT);const batch=[...nw,...old];if(!batch.length)return;
    const oldIds=new Set(old.map(w=>w.id));const rdOf=w=>oldIds.has(w.id)||passedR1(w.id)?2:1;
    const ch=a=>{const o=[];for(let i=0;i<a.length;i+=GRUPPO)o.push(a.slice(i,i+GRUPPO));return o};
    const c1=ch(batch.filter(w=>rdOf(w)===1)),c2=ch(batch.filter(w=>rdOf(w)===2));const rounds=[];
    for(const g of c1)rounds.push({rd:1,words:g});for(const g of c2)rounds.push({rd:2,words:g}); // prima TED→ITA, poi ITA→TED
    rounds.forEach((x,i)=>{x.g=i+1;x.ng=rounds.length});
    Q={kind,batch,rounds,ri:0,bad:new Set(),ok:0,errs:[],cur:null,free:false,t0:Date.now(),rs:{},asked:0};startRound();return}
  if(!items.length)return;
  Q={queue:items.map(e=>({...e,tries:0})),done:0,total:items.length,ok:0,errs:[],cur:null,state:"ask",free:kind!=="sera",kind};nextQ()}
function startRound(){const st=Q.rounds[Q.ri],rd=st.rd,F=FASI[rd];
  const items=shuffle(st.words).map(w=>({w,mode:F.mode,dir:F.dir,phase:rd,tries:0}));
  Q.queue=items;Q.total=items.length;Q.done=0;nextQ()}
function finishSera(){const t=today();S.tent=Object.assign({},S.tent);S.wrong=Object.assign({},S.wrong);S.done=Object.assign({},S.done);S.r1ok=Object.assign({},S.r1ok);
  const rd={};for(const st of Q.rounds)for(const w of st.words)rd[w.id]=st.rd;
  for(const w of Q.batch){S.tent[w.id]={d:t};if(Q.bad.has(w.id))S.wrong[w.id]=true;else{delete S.wrong[w.id];if(rd[w.id]===1)S.r1ok[w.id]=t;else S.done[w.id]=S.done[w.id]||t}}
  S.fatto=Object.assign({},S.fatto,{[t]:true});save();report()}
/* Invio dei risultati per la dashboard dei genitori (tab Genitori).
   Ogni famiglia sceglie un codice; il telefono del ragazzo invia con quel codice,
   il genitore inserisce lo stesso codice e vede solo i dati della sua famiglia.
   I dati finiscono in un Foglio Google tramite Apps Script (REPORT_URL). */
const REPORT_URL="https://script.google.com/macros/s/AKfycbxkERFGPyVxGrUkB6F6wfQl43mvrlk0PTyW3d_w0FZwjaRzMVEb5nsAj8_EesqjYTVRLA/exec";
function report(){if(!REPORT_URL||!S.invia||!S.famiglia)return;const cur=currentList(),bad=Q.batch.filter(w=>Q.bad.has(w.id));
  const rr={};for(const k of [1,2,3,4,5,6]){const x=Q.rs[k];rr["r"+k]=x?`${x.ok}/${x.n}`:""}
  S.outbox=[...(S.outbox||[]),{app:"vokabeln-gabri",id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),famiglia:S.famiglia,nome:S.nome||"",data:today(),capitolo:cur.nome.split(" · ")[0],
    parole:Q.batch.length,imparate:Q.batch.length-bad.length,sbagliate:bad.length,paroleSbagliate:bad.map(w=>w.de+" = "+w.it),...rr,
    domande:Q.asked,minuti:Math.max(1,Math.round((Date.now()-Q.t0)/60000)),imparateCapitolo:phaseCount(cur),totaleCapitolo:wordsOf(cur).length,
    imparateTotali:Object.keys(S.done||{}).length}];save();sendOutbox()}
async function sendOutbox(){if(!REPORT_URL||!S.invia||!(S.outbox||[]).length||sendOutbox.busy)return;sendOutbox.busy=true;
  try{while(S.outbox.length){await fetch(REPORT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(S.outbox[0])});S.outbox=S.outbox.slice(1);save()}}catch(e){}
  sendOutbox.busy=false}
function pickMode(entry){if(entry.mode)return entry.mode;const m=S.modo;const c=cardOf(entry.w.id);
  if(m!=="misto")return m;
  if(!c||c.box<=1)return entry.tries?"scelta":"carte";
  return c.box<=2?"scelta":"scrivi"}
function pickDir(){return S.direzione==="mix"?(Math.random()<.5?"it-de":"de-it"):S.direzione}
/* Risposte sbagliate "furbe": stesso tipo di parola (nome/verbo/altro), stesso articolo,
   stesso capitolo, lunghezza e iniziale simili. Così non si indovina per esclusione. */
function wkind(de){const d=de.replace(/\([^)]*\)/g,"").trim();
  if(/^(der|die|das)(\/(der|die|das))?\s/i.test(d))return "nome";
  if(/^(ich|du|er|sie|es|wir)\s/.test(d))return "forma";
  if(/^[a-zäöü]+(en|ern|eln)$/.test(d))return "verbo";
  if(/^[A-ZÄÖÜ]/.test(d))return "nome";
  return "altro"}
const artOf=de=>((de.match(/^(der|die|das)\s/i)||[])[1]||"").toLowerCase();
const itArt=it=>((it.match(/^(il|lo|la|l'|i|gli|le)\s?/i)||[])[1]||"").toLowerCase();
function trickyPool(w,pool,key){const k=wkind(w.de),a=artOf(w.de),ia=itArt(w.it),ans=norm(w[key]);
  const score=x=>{let sc=Math.random()*2;
    if(wkind(x.de)===k)sc+=6;if(a&&artOf(x.de)===a)sc+=3;if(ia&&itArt(x.it)===ia)sc+=2;
    if(x.lista===w.lista)sc+=2;const o=norm(x[key]);
    if(Math.abs(o.length-ans.length)<=3)sc+=1.5;
    if(o.replace(/^(der|die|das|il|lo|la|l'|i|gli|le)\s?/,"")[0]===ans.replace(/^(der|die|das|il|lo|la|l'|i|gli|le)\s?/,"")[0])sc+=1.5;
    return sc};
  return pool.map(x=>[x,score(x)]).sort((p,q)=>q[1]-p[1]).map(p=>p[0])}
function nextQ(){if(!Q.queue.length){
    if(Q.kind==="sera"&&Q.ri<Q.rounds.length-1){Q.ri++;view="round";render();return}
    if(Q.kind==="sera")finishSera();view="fine";render();return}
  const e=Q.queue.shift();Q.cur={...e,mode:pickMode(e),dir:e.dir||pickDir(),answer:"",result:null,flipped:false};
  if(Q.cur.mode==="scelta"){const pool=allWords().filter(x=>x.id!==e.w.id);const key=Q.cur.dir==="it-de"?"de":"it";
    const pkey=key==="de"?"it":"de";const pn=variants(e.w[pkey]).join("|");
    const seen=new Set([e.w[key]]);for(const x of pool)if(variants(x[pkey]).join("|")===pn)seen.add(x[key]);const opts=[e.w];for(const x of trickyPool(e.w,pool,key)){if(opts.length>=5)break;if(!seen.has(x[key])){seen.add(x[key]);opts.push(x)}}
    Q.cur.opts=shuffle(opts)}
  view="quiz";render()}
function answer(correct,extra){const c=Q.cur;c.result=correct?"ok":"bad";c.extra=extra||"";
  if(Q.rs)Q.asked++;
  if(c.tries===0){grade(c.w,correct);if(correct)Q.ok++;else{Q.errs.push(c.w);if(Q.bad)Q.bad.add(c.w.id)}
    if(Q.rs&&c.phase){const x=Q.rs[c.phase]||(Q.rs[c.phase]={n:0,ok:0});x.n++;if(correct)x.ok++}}
  else if(!correct&&S.cards[c.w.id]){S.cards[c.w.id].ko++;save()}
  if(!correct)Q.queue.splice(Math.min(Q.queue.length,3),0,{w:c.w,mode:c.mode,dir:c.dir,phase:c.phase,tries:c.tries+1});else Q.done++;
  render()}

function vQuiz(){const c=Q.cur,w=c.w;const askDe=c.dir==="de-it";const art=c.mode==="articolo";const tipo=c.mode==="tipo";const prompt=(art||tipo)?w.de.replace(/^(der|die|das)\s+/i,""):askDe?w.de:w.it;const target=askDe?w.it:w.de;
  const pct=Q.done/Q.total*100;

      ${c.flipped&&!c.result?`<div class="two"><button id="no" style="border-color:var(--bad);color:var(--bad)">Non lo sapevo</button><button id="si" style="border-color:var(--ok);color:var(--ok)">Lo sapevo</button></div>`:""}`;

      <div class="chips">${Object.entries(TIPO_NOMI).map(([k,t])=>{const cls=c.result?(k===tipoOf(w)?"ok":c.tipo===k?"bad":""):"";return `<button type="button" class="chip ${cls}" data-tipo="${k}" aria-pressed="${c.tipo===k}" ${c.result?"disabled":""}>${t}</button>`}).join("")}</div>
      ${c.tipo==="s"||(c.result&&hasArt)?`<p class="label">Articolo</p><div class="chips">${["der","die","das"].map(a=>{const cls=c.result?(a===artOf(w.de)?"ok":c.art===a?"bad":""):"";return `<button type="button" class="chip art-${a} ${cls}" data-art="${a}" aria-pressed="${c.art===a}" ${c.result?"disabled":""}>${a}</button>`}).join("")}${!c.result&&c.art?`<button type="button" class="chip" data-art="none" aria-label="Cancella l'articolo scelto">✕</button>`:""}</div>`:""}
      ${c.result?"":`<button class="primary big" type="submit" ${!c.tipo||(c.tipo==="s"&&hasArt&&!c.art)?"disabled":""}>Controlla</button>`}
    </form>`;
  }else if(c.mode==="scelta"){
    const key=askDe?"it":"de";
    body=`<div class="opts">${c.opts.map((o,i)=>{let cls="";if(c.result){if(o.id===w.id)cls="ok";else if(c.picked===i)cls="bad"}else if(c.picked===i)cls="sel";
      return `<button class="opt ${cls}" data-opt="${i}" aria-pressed="${c.picked===i}" ${c.result?"disabled":""}>${key==="de"?deHtml(o.de):esc(o.it)}</button>`}).join("")}</div>
      ${c.result?"":`<button class="primary big" id="confirm" ${c.picked==null?"disabled":""}>Avanti</button>`}`;
  }else{
    body=`<form id="typeform" class="row" autocomplete="off"><input type="text" id="typed" class="grow" placeholder="${art?"der, die o das?":askDe?"Scrivi in italiano":"Scrivi in tedesco, con l'articolo"}" value="${esc(c.answer)}" ${c.result?"disabled":""} autocapitalize="off" spellcheck="false" lang="${askDe&&!art?"it":"de"}">
      ${c.result?"":`<button class="primary" type="submit">Controlla</button>`}</form>
      ${!askDe&&!c.result?`<div class="chips">${["ä","ö","ü","ß"].map(k=>`<button class="chip" data-key="${k}" type="button">${k}</button>`).join("")}<button class="chip" id="dunno" type="button">Non lo so</button></div><div class="chips">${["Ä","Ö","Ü"].map(k=>`<button class="chip" data-key="${k}" type="button">${k}</button>`).join("")}</div>`:""}`;
  }
  let fb="";
  if(c.result){const msgs={ok:["Giusto!","Richtig!","Super!","Perfetto!"],bad:["Non ancora","Quasi, riprova più tardi"]};
    const m=c.result==="ok"?msgs.ok[Math.random()*msgs.ok.length|0]:"Non ancora: la ritrovi tra poco.";
    fb=`<div class="feedback ${c.result} pop"><span>${c.extra||m}</span><span class="ans">${deHtml(w.de)} = ${esc(w.it)}</span></div>
      <button class="primary big" id="next">${Q.queue.length?"Avanti":"Fine"}</button>`}
  return `
  <div class="progress"><button class="ghost" id="quit" aria-label="Esci dal quiz">✕ Esci</button><div class="bar"><span style="width:${pct}%;background:var(--ok)"></span></div><span class="small muted" style="font-variant-numeric:tabular-nums">${Q.rounds?`G${Q.rounds[Q.ri].g}/${Q.rounds[Q.ri].ng} · R${Q.rounds[Q.ri].rd} · `:""}${Q.done}/${Q.total}</span></div>
  <section class="sheet pop">
    <div class="prompt"><p class="label">${art?"Qual è l'articolo?":askDe?"Cosa vuol dire?":"Come si dice in tedesco?"}</p>
      <p class="word">${tipo?(c.result?deHtml(w.de):esc(prompt)):art?`<span class="muted">___</span> ${esc(prompt)}`:askDe?deHtml(prompt):esc(prompt)}</p>
      ${art?`<p class="muted">${esc(w.it)}</p>`:""}
      ${askDe||c.result||c.flipped?`<button class="say" id="say" type="button">Ascolta</button>`:""}</div>
    ${body}${fb}
  </section>`}

function vRound(){const st=Q.rounds[Q.ri],F=FASI[st.rd];const prev=Q.rounds[Q.ri-1];

function dashChart(days){const W=520,H=200,L=30,B=26,T=8,R=6;const max=Math.max(5,...days.map(([,d])=>d?d.imp+d.sba:0));
  const step=Math.ceil(max/4/5)*5||5,top=step*4;const y=v=>T+(H-T-B)*(1-v/top);const bw=(W-L-R)/days.length;const w=Math.min(22,bw-6);
  const fmt=d=>{const [a,m,g]=d.split("-");return `${+g}/${+m}`};let g="";
  for(let i=0;i<=4;i++){const v=i*step;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${L-5}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`}
  days.forEach(([k,d],i)=>{const x=L+i*bw+(bw-w)/2;
    if(i%2===days.length%2||days.length<=7)g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${fmt(k)}</text>`;
    if(d){const yb=y(0),h1=(H-T-B)*d.imp/top,h2=(H-T-B)*d.sba/top;
      if(d.imp)g+=`<rect x="${x}" y="${yb-h1}" width="${w}" height="${h1}" rx="3" fill="var(--ok)"/>`;
      if(d.sba)g+=`<rect x="${x}" y="${yb-h1-h2-(d.imp?2:0)}" width="${w}" height="${h2}" rx="3" fill="var(--bad)"/>`}
    g+=`<rect x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent" data-i="${i}"/>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Parole imparate e da rifare per sera, ultime due settimane">${g}</svg>`}
function hookTip(){const svg=$("#dbchart svg"),tip=$("#dbtip");if(!svg||!G||!G.days)return;
  const show=e=>{const t=e.target.closest("[data-i]");if(!t){tip.hidden=true;return}const [k,d]=G.days[+t.dataset.i];const [a,m,g]=k.split("-");
    const box=$("#dbchart").getBoundingClientRect();tip.style.left=Math.min(Math.max(e.clientX-box.left,70),box.width-70)+"px";tip.style.top=(e.clientY-box.top)+"px";

  svg.addEventListener("pointermove",show);svg.addEventListener("pointerdown",show);svg.addEventListener("pointerleave",()=>tip.hidden=true)}

  addEventListener("touchstart",e=>{y0=(scrollY<=0&&view!=="quiz")?e.touches[0].clientY:null;pulled=0},{passive:true});
  addEventListener("touchmove",e=>{if(y0===null)return;pulled=e.touches[0].clientY-y0;if(pulled>20){tip.style.opacity=1;tip.textContent=pulled>110?"Lascia per aggiornare":"Tira giù per aggiornare"}},{passive:true});
  addEventListener("touchend",()=>{tip.style.opacity=0;if(y0!==null&&pulled>110){tip.textContent="Aggiorno…";tip.style.opacity=1;
    (navigator.serviceWorker&&navigator.serviceWorker.getRegistration?navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{}):Promise.resolve()).finally(()=>location.reload())}y0=null});
})();
</script>
